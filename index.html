<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Idle RPG</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚔️</text></svg>" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="lvl">
          <span id="lvl">Lv. 1</span>
          <div class="expbar"><div id="expfill"></div></div>
        </div>
        <div class="cur"><span>🪙</span><b id="gold">0</b></div>
        <div class="cur"><span>💎</span><b id="gems">0</b></div>
      </header>

      <section id="battle">
        <canvas id="canvas"></canvas>
      </section>

      <section id="stagebar">
        <div>
          <div id="stagename">Stage</div>
          <div class="killbar"><div id="killfill"></div><span id="killtext"></span></div>
        </div>
        <div class="power">⚡ <b id="power">0</b></div>
        <button id="bossbtn" class="btn boss hidden">Challenge Boss</button>
      </section>

      <nav id="tabs">
        <button data-tab="growth" class="active">📈<span>Growth</span></button>
        <button data-tab="gear">🗡️<span>Gear</span></button>
        <button data-tab="companions">🐾<span>Companions</span></button>
        <button data-tab="summon">✨<span>Summon</span></button>
        <button data-tab="info">⚙️<span>Info</span></button>
      </nav>

      <main id="panel"></main>
    </div>

    <div id="toasts"></div>
    <div id="modal" class="hidden"><div class="modal-box" id="modalbox"></div></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
