<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Idle RPG</title>
    <meta name="theme-color" content="#0b0a08" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚔️</text></svg>" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="charselect" class="hidden"></div>
    <div id="app" class="hidden">
      <section id="battle">
        <canvas id="canvas"></canvas>

        <!-- HUD floating over the game -->
        <header id="topbar" class="hudpanel">
          <div class="lvl">
            <span id="lvl">Lv. 1</span>
            <div class="expbar"><div id="expfill"></div></div>
          </div>
          <div class="cur"><span>🪙</span><b id="gold">0</b></div>
          <div class="cur"><span>💎</span><b id="gems">0</b></div>
          <button id="switchbtn" class="cur hudswitch" title="Switch character">👥</button>
        </header>
        <div id="hud-top">
          <button id="autobtn" class="hudbtn">AUTO</button>
          <span id="modebadge" class="badge hidden">MANUAL</span>
        </div>
        <div id="keyhint">WASD move · Mouse aim · Click / J attack · Space class ability · 1-3 skills · F deadeye · R flask · E summon · Q auto · Esc close menu</div>

        <section id="stagebar" class="hudpanel">
          <div class="stage-info">
            <div id="stagename">Stage</div>
            <div class="killbar"><div id="killfill"></div><span id="killtext"></span></div>
          </div>
          <div class="stage-side">
            <div class="power">⚡ <b id="power">0</b></div>
            <button id="bossbtn" class="btn boss hidden">Fight boss</button>
            <span id="phasepick" class="hidden" title="Testing: summon straight into a later phase">
              <button class="btn alt" data-summon-phase="1">P2</button>
              <button class="btn alt" data-summon-phase="2">P3</button>
            </span>
            <button id="leavebtn" class="btn alt hidden">Leave lair</button>
          </div>
        </section>

        <div id="deathbox" class="hudpanel hidden">
          <div class="death-title">You have fallen</div>
          <div class="death-btns">
            <span class="death-label">Fight again:</span>
            <button class="btn boss" data-retry="0">Phase 1</button>
            <button class="btn boss" data-retry="1">Phase 2</button>
            <button class="btn boss" data-retry="2">Phase 3</button>
            <button id="respawnbtn" class="btn alt">Respawn</button>
          </div>
        </div>
        <div id="skillbar"></div>
        <div id="stick" class="hidden"><div id="stick-knob"></div></div>
        <div id="pad-right" class="pad">
          <button data-key="attack">⚔️</button>
        </div>

        <nav id="tabs">
          <button data-tab="growth" title="Growth">📈<span>Growth</span></button>
          <button data-tab="world" title="World">🗺️<span>World</span></button>
          <button data-tab="talents" class="tabdot-host" title="Talents">🌟<span>Talents</span><i id="talentdot" class="tabdot hidden"></i></button>
          <button data-tab="gear" title="Gear">🗡️<span>Gear</span></button>
          <button data-tab="companions" title="Companions">🐾<span>Allies</span></button>
          <button data-tab="summon" title="Summon">✨<span>Summon</span></button>
          <button data-tab="info" title="Info">⚙️<span>Info</span></button>
        </nav>

        <div id="window" class="hidden">
          <div class="win-head">
            <span id="wintitle"></span>
            <button id="winclose" title="Close (Esc)">✕</button>
          </div>
          <main id="panel"></main>
        </div>
      </section>
    </div>

    <div id="toasts"></div>
    <div id="modal" class="hidden"><div class="modal-box" id="modalbox"></div></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
