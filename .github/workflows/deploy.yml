name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The classic side-scroller lives on its own branch and is served at /side/
      - uses: actions/checkout@v4
        with:
          ref: side-scroller
          path: side
      # The survivors-style run mode lives on the bonk branch and is served at /bonk/
      - uses: actions/checkout@v4
        with:
          ref: bonk
          path: bonk
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build side-scroller into dist/side
        run: |
          cd side
          npm ci
          npm run build
          mkdir -p ../dist/side
          cp -r dist/* ../dist/side/
      - name: Build bonk into dist/bonk
        run: |
          cd bonk
          npm ci
          npm run build
          mkdir -p ../dist/bonk
          cp -r dist/* ../dist/bonk/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
